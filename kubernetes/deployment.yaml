apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommercewebapi
  namespace: ecommercewebapi
  labels:
    app: ecommercewebapi
    version: "1.0"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommercewebapi
  template:
    metadata:
      labels:
        app: ecommercewebapi
        version: "1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: ecommercewebapi
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: SIGNALR_PORT
              value: "5000"
            - name: DOTNET_RUNNING_IN_CONTAINER
              value: "true"
            - name: ApplicationSettings__Secret
              value: "{{APPLICATION_SECRET}}"
            - name: REDIS_CONNECTION_STRING
              value: "{{REDIS_CONNECTION_STRING}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: logs-volume
              mountPath: /app/Logs
            - name: database-volume
              mountPath: /app/database.json
              subPath: database.json
      volumes:
        - name: logs-volume
          emptyDir: {}
        - name: database-volume
          configMap:
            name: ecommercewebapi-database
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
